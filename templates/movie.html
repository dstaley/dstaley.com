{% extends "base.html" %}

{% block main %}
  {% set back_path = "/movies/" %}
  {% set back_label = "Movies" %}
  {% include "back_button.html" %}
  <article>
    {% set description %}{{ <entry.movie_description theater={page.extra.theater} screen={page.extra.screen or ""} seat={page.extra.seat or ""} /> }}{% endset %}
    {{ <entry.heading
      title={page.title}
      description={description}
      date={page.date | date(format="%a %B %-d, %Y @ %-I:%M%P")}
      slug={page.slug}
      additional_description={page.description or ""}
    /> }}
    <main class="prose dark:prose-invert prose-a:text-tomato-600 dark:prose-a:text-tomato-300 prose-pre:shadow-lg prose-video:shadow-lg prose-img:rounded-md prose-img:shadow-lg prose-video:rounded-md prose-headings:text-base">{{ page.content | safe }}</main>
  </article>
{% endblock %}
